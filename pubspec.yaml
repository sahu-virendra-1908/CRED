name: cred_card_management
description: Production-grade Flutter Card Management screen inspired by CRED.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  equatable: ^2.0.5
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0
  go_router: ^14.2.7
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  assets:
    - assets/icon/cred_logo.png
    - assets/icon/cred_logo_foreground.png
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/cred_logo.png"
  adaptive_icon_background: "assets/icon/cred_logo_bg.png"
  adaptive_icon_foreground: "assets/icon/cred_logo_foreground.png"

flutter_native_splash:
  color: "#141416"
  image: "assets/icon/empty_splash.png"
  android_12:
    color: "#141416"
    icon_background_color: "#141416"
    image: "assets/icon/empty_splash.png"
  ios: false
  web: false
